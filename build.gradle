plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'jacoco'
}

ext {
    set('springCloudVersion', '2025.1.1')
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'war'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    jacoco {
        toolVersion = '0.8.14'
    }

    dependencies {

        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-amqp'

        implementation 'org.springframework.boot:spring-boot-starter-flyway'
        runtimeOnly 'org.flywaydb:flyway-database-postgresql'
        runtimeOnly 'org.postgresql:postgresql'

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

        testRuntimeOnly 'com.h2database:h2'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.matching {
        it.name in ['processTestAot', 'compileAotTestJava', 'processAotTestResources']
    }.configureEach {
        enabled = false
    }

    def localExcludedPatterns = [
            "**/*.dto.*", "**/*.entity.*", "**/*.config.*",
            "**/*Application.class", "**/*Initializer.class",
            "**/dto/**", "**/entity/**", "**/config/**"
    ]

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        classDirectories.setFrom(provider {
            sourceSets.main.output.classesDirs.asFileTree.matching {
                exclude localExcludedPatterns
            }
        })
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn tasks.named('jacocoTestReport')
        classDirectories.setFrom(provider {
            sourceSets.main.output.classesDirs.asFileTree.matching {
                exclude localExcludedPatterns
            }
        })
        violationRules {
            rule {
                limit {
                    minimum = 0.7
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}

def aggregateExcludedPatterns = [
        '**/*.dto.*', '**/*.entity.*', '**/*.config.*',
        '**/*Application.class', '**/*Application.java', '**/*Initializer.class',
        '**/dto/**', '**/entity/**', '**/config/**'
]

tasks.register('aggregateJacocoReport', JacocoReport) {
    dependsOn(subprojects.collect { it.tasks.named('test') })

    executionData.from(files(subprojects.collect { project ->
        fileTree(dir: project.layout.buildDirectory.get().asFile, include: 'jacoco/test.exec')
    }))

    classDirectories.setFrom(files(subprojects.collect { project ->
        fileTree(dir: "${project.layout.buildDirectory.get().asFile}/classes/java/main", exclude: aggregateExcludedPatterns)
    }))

    sourceDirectories.setFrom(files(subprojects.collect { project ->
        project.sourceSets.main.allSource.srcDirs
    }))

    additionalSourceDirs.setFrom(sourceDirectories)

    reports {
        html.required = true
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregateJacocoReport')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregateJacocoReport.xml')
    }
}

tasks.register('aggregateJavadoc', Javadoc) {
    dependsOn(subprojects.collect { it.tasks.named('classes') })
    source(subprojects.collect { it.sourceSets.main.allJava })
    classpath = files(subprojects.collect { it.sourceSets.main.compileClasspath })
    destinationDir = layout.buildDirectory.dir('docs/aggregated-javadoc').get().asFile
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.memberLevel = JavadocMemberLevel.PROTECTED
}
