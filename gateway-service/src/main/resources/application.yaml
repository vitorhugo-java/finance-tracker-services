spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:.env.example[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  security:
    keycloak:
      realm: finance-tracker-realm
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${application.security.keycloak.public-base-url}/realms/${application.security.keycloak.realm}}
      client:
        provider:
          keycloak:
            authorization-uri: ${application.security.keycloak.public-base-url}/realms/${application.security.keycloak.realm}/protocol/openid-connect/auth
            token-uri: ${application.security.keycloak.public-base-url}/realms/${application.security.keycloak.realm}/protocol/openid-connect/token
            jwk-set-uri: ${application.security.keycloak.public-base-url}/realms/${application.security.keycloak.realm}/protocol/openid-connect/certs
            user-name-attribute: preferred_username
        registration:
          keycloak-swagger:
            provider: keycloak
            client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID:gateway-swagger}
            authorization-grant-type: authorization_code
            client-authentication-method: none
            redirect-uri: "{baseUrl}/swagger-ui/oauth2-redirect.html"
            scope:
              - openid
              - profile
              - email
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: keycloak_route
              uri: ${KEYCLOAK_SERVICE_URI:http://localhost:8180}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: transactions-docs-route
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8280}
              predicates:
                - Path=/api/transactions/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: transactions-route
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8280}
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=2

            - id: reports-route
              uri: ${REPORT_SERVICE_URI:http://localhost:8380}
              predicates:
                - Path=/api/reports/**

            - id: reports-docs-route
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8280}
              predicates:
                - Path=/api/reports/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
  docker:
    compose:
      profiles:
        active: ${DOCKER_PROFILE:dev}
      enabled: ${DOCKER_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    init-oauth:
      clientId: gateway-swagger
      usePkceWithAuthorizationCodeGrant: true
    oauth2-redirect-url: http://localhost:8080/swagger-ui/oauth2-redirect.html
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: transaction-service
        url: http://localhost:8080/api/transactions/v3/api-docs
      - name: report-service
        url: http://localhost:8080/api/reports/v3/api-docs
    oauth:
      client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID:gateway-swagger}
      app-name: Finance Tracker Gateway
      realm: ${application.security.keycloak.realm}
      use-pkce-with-authorization-code-grant: true
      scopes:
        - openid
        - profile
        - email

application:
  security:
    keycloak:
      realm: ${KEYCLOAK_REALM:finance-tracker-realm}
      public-base-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env
