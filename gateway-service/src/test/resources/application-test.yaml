spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/fake-jwks
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/finance-tracker-realm/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/finance-tracker-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8080/realms/finance-tracker-realm/protocol/openid-connect/certs
  cloud:
    gateway:
      mvc:
        routes:
          - id: transactions-route
            uri: http://transaction-service:8080
            predicates:
              - Path=/api/transactions/**
            filters:
              - StripPrefix=2
          - id: reports-route
            uri: http://report-service:8180
            predicates:
              - Path=/api/reports/**
            filters:
              - StripPrefix=2
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false

springdoc:
  swagger-ui:
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: transaction-service
        url: /api/transactions/v3/api-docs
      - name: report-service
        url: /api/reports/v3/api-docs
    oauth:
      client-id: gateway-swagger
      use-pkce-with-authorization-code-grant: true

application:
  security:
    keycloak:
      realm: finance-tracker-realm
      public-base-url: http://localhost:8080

management:
  server:
    port: ${server.port:8080}
  endpoints:
    web:
      exposure:
        include: health
