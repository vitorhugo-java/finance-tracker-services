spring:
  application:
    name: transaction-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:classpath:.env.example[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transaction_service_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      profiles:
        active: ${DOCKER_PROFILE:dev}
      enabled: ${DOCKER_ENABLED:true}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

server:
  port: 8280

management:
  server:
    port: 8281
  endpoints:
    web:
      exposure:
        include: health, info, metrics