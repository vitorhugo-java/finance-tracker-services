services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - finance_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: finance-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: finance-redis
    ports:
      - "6379:6379"
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import/finance-tracker-realm-realm.json:/opt/keycloak/data/import/finance-tracker-realm-realm.json
    networks:
      - finance_network
    healthcheck:
      test: [ "CMD-SHELL","wget --spider -q http://localhost:9000/health/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      KEYCLOAK_REALM: finance-tracker-realm
      KEYCLOAK_PUBLIC_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/finance-tracker-realm
      KEYCLOAK_SWAGGER_CLIENT_ID: gateway-swagger
    depends_on:
      keycloak:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - finance_network

  transaction-service:
    build:
      context: .
      dockerfile: ./transaction-service/Dockerfile
    container_name: transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transaction_service_db
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8280:8280"
    networks:
      - finance_network
    healthcheck:
      test: [ "CMD-SHELL","wget --spider -q http://localhost:8280/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10

  report-service:
    build:
      context: .
      dockerfile: ./report-service/Dockerfile
    container_name: report-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8380:8380"
    networks:
      - finance_network
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8380/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: postgres_data

networks:
  finance_network:
    driver: bridge
