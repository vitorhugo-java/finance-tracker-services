services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - finance_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: finance-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: finance-redis
    ports:
      - "6379:6379"
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
      # Pin the public-facing issuer so every token carries iss=http://localhost:8180/...
      # regardless of whether it was requested from the host browser or from inside the
      # Docker network. Backchannel-dynamic lets services fetch JWKS at keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/import/finance-tracker-realm-realm.json:/opt/keycloak/data/import/finance-tracker-realm-realm.json
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      KEYCLOAK_REALM: finance-tracker-realm
      # Browser-facing endpoints (Swagger auth/token, issuer) must use localhost:8180.
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/finance-tracker-realm
      # JWKS is fetched server-to-server, so it stays on the internal network.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/finance-tracker-realm/protocol/openid-connect/certs
      KEYCLOAK_SWAGGER_CLIENT_ID: gateway-swagger
      KEYCLOAK_SERVICE_URI: http://keycloak:8080
      TRANSACTION_SERVICE_URI: http://transaction-service:8280
      REPORT_SERVICE_URI: http://report-service:8380
      TEMPO_HOST: tempo
    depends_on:
      keycloak:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - finance_network

  transaction-service:
    build:
      context: .
      dockerfile: ./transaction-service/Dockerfile
    container_name: transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transaction_service_db
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_REALM: finance-tracker-realm
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/finance-tracker-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/finance-tracker-realm/protocol/openid-connect/certs
      TEMPO_HOST: tempo
    ports:
      - "8280:8280"
    networks:
      - finance_network
    healthcheck:
      test: [ "CMD-SHELL","wget --spider -q http://localhost:8281/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  report-service:
    build:
      context: .
      dockerfile: ./report-service/Dockerfile
    container_name: report-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: report_service_db
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KEYCLOAK_REALM: finance-tracker-realm
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/finance-tracker-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/finance-tracker-realm/protocol/openid-connect/certs
      TEMPO_HOST: tempo
    ports:
      - "8380:8380"
    networks:
      - finance_network
    healthcheck:
      test: [ "CMD-SHELL","wget --spider -q http://localhost:8381/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - finance_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - finance_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - finance_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - finance_network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - finance_network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    name: postgres_data
  prometheus_data:
    name: prometheus_data
  loki_data:
    name: loki_data
  tempo_data:
    name: tempo_data
  grafana_data:
    name: grafana_data

networks:
  finance_network:
    driver: bridge
